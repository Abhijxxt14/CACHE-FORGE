services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cacheforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cacheforge}
      POSTGRES_DB: ${POSTGRES_DB:-cacheforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cacheforge} -d ${POSTGRES_DB:-cacheforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      INSTANCE_ID: api1
      API_PORT: 8000
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      INSTANCE_ID: api2
      API_PORT: 8000
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  locust:
    image: locustio/locust:2.32.2
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/mnt/locust
    ports:
      - "8089:8089"
    command: >
      -f /mnt/locust/locustfile.py
      --host http://api1:8000
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

volumes:
  postgres_data:

